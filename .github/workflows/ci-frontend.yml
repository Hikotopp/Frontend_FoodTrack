name: Frontend CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
    branches: [main, master, develop]

jobs:
  build-and-test:
    name: Build and Unit Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests with coverage
        run: npm run test:ci

      - name: Build production bundle
        run: npm run build -- --configuration=production

      - name: Upload coverage
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: coverage/

  cypress:
    name: Cypress E2E
    runs-on: ubuntu-latest
    needs: build-and-test

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Create Docker network
        run: docker network create foodtrack-network

      - name: Start MySQL
        run: |
          docker run -d --name foodtrack-mysql --network foodtrack-network \
            -e MYSQL_ROOT_PASSWORD=1234 \
            -e MYSQL_DATABASE=foodtrack \
            mysql:8.0

      - name: Wait for MySQL
        run: |
          for i in {1..60}; do
            if docker exec foodtrack-mysql mysqladmin ping -h localhost -p1234 --silent; then exit 0; fi
            sleep 2
          done
          docker logs foodtrack-mysql
          exit 1

      - name: Start backend image
        run: |
          docker run -d --name foodtrack-backend --network foodtrack-network -p 8080:8080 \
            -e SPRING_PROFILES_ACTIVE=prod \
            -e SPRING_DATASOURCE_URL='jdbc:mysql://foodtrack-mysql:3306/foodtrack?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8' \
            -e SPRING_DATASOURCE_USERNAME=root \
            -e SPRING_DATASOURCE_PASSWORD=1234 \
            -e JWT_SECRET=foodtrack-ci-secret-key-must-have-at-least-32-bytes \
            -e JWT_EXPIRATION=86400000 \
            -e APP_SEED_ENABLED=true \
            -e APP_BOOTSTRAP_ADMIN_NAME='FoodTrack Admin' \
            -e APP_BOOTSTRAP_ADMIN_EMAIL=admin@foodtrack.local \
            -e APP_BOOTSTRAP_ADMIN_PASSWORD=Admin123. \
            -e APP_CORS_ALLOWED_ORIGINS=http://localhost:4200 \
            hikotopp/foodtrack-backend:latest

      - name: Wait for backend
        run: |
          for i in {1..90}; do
            if curl -fsS http://localhost:8080/actuator/health; then exit 0; fi
            sleep 2
          done
          docker logs foodtrack-backend
          exit 1

      - name: Run Cypress
        env:
          CYPRESS_ADMIN_EMAIL: admin@foodtrack.local
          CYPRESS_ADMIN_PASSWORD: Admin123.
        run: |
          npm start &
          for i in {1..60}; do
            if curl -fsS http://localhost:4200; then
              npm run e2e
              exit $?
            fi
            sleep 2
          done
          echo "Frontend did not become ready on http://localhost:4200"
          exit 1
